<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despertador web</title>
    <link rel="stylesheet" href="alarmas.css">
    <script src="alarmas.js" defer></script>
</head>
<body>

<div class="pagina">

    <header class="encabezado">
        <h1>⏰ Despertador</h1>
        <a href="../index.html" class="enlace-volver">← Volver al CV</a>
    </header>

    <div class="rejilla">

        <!-- RELOJ -->
        <section id="tarjetaReloj" class="tarjeta tarjeta-reloj">

            <svg id="analogico" viewBox="0 0 200 200" role="img" aria-label="Reloj analógico">
                <circle cx="100" cy="100" r="95" class="esfera"/>
                <g id="marcas"></g>
                <line id="manoHora" x1="100" y1="100" x2="100" y2="55" class="mano mano-hora"/>
                <line id="manoMinuto" x1="100" y1="100" x2="100" y2="32" class="mano mano-minuto"/>
                <line id="manoSegundo" x1="100" y1="112" x2="100" y2="24" class="mano mano-segundo"/>
                <circle cx="100" cy="100" r="5" class="centro"/>
            </svg>

            <p id="horaDigital" class="digital">00:00:00</p>
            <p id="fechaTexto" class="fecha-texto"></p>
            <p id="proxima" class="proxima"></p>

            <div id="avisoAlarma" class="aviso" hidden>
                <p id="textoAviso" class="texto-aviso"></p>
                <div class="aviso-botones">
                    <button id="btnPosponer" class="btn btn-claro">Posponer 5 min</button>
                    <button id="btnParar" class="btn btn-claro">Detener</button>
                </div>
            </div>
        </section>

        <div class="columna">

            <!-- NUEVA ALARMA -->
            <section class="tarjeta">
                <h2>Nueva alarma</h2>
                <form id="formNueva" class="formulario">
                    <label>Fecha
                        <input type="date" id="inFecha" required>
                    </label>
                    <label>Hora
                        <input type="time" id="inHora" required>
                    </label>
                    <label>Nombre (opcional)
                        <input type="text" id="inNombre" maxlength="30" placeholder="Ej: Reunión">
                    </label>
                    <p id="msgError" class="msg-error" hidden></p>
                    <button type="submit" class="btn btn-principal">Agregar alarma</button>
                </form>
            </section>

            <!-- LISTA -->
            <section class="tarjeta">
                <h2>Alarmas programadas</h2>
                <ul id="listaAlarmas" class="lista"></ul>
                <p id="sinAlarmas" class="sin-alarmas">Aún no has agregado alarmas.</p>
            </section>

        </div>
    </div>
</div>

<!-- VENTANA PARA EDITAR -->
<dialog id="dlgEditar" class="dialogo">
    <form id="formEditar" class="formulario">
        <h2>Editar alarma</h2>
        <label>Fecha
            <input type="date" id="edFecha" required>
        </label>
        <label>Hora
            <input type="time" id="edHora" required>
        </label>
        <label>Nombre
            <input type="text" id="edNombre" maxlength="30">
        </label>
        <p id="edError" class="msg-error" hidden></p>
        <div class="fila-botones">
            <button type="button" id="btnCancelarEd" class="btn btn-gris">Cancelar</button>
            <button type="submit" class="btn btn-principal">Guardar cambios</button>
        </div>
    </form>
</dialog>

</body>
</html>
